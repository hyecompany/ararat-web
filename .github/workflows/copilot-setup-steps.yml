name: Copilot Setup Steps

# This workflow prepares a dev environment for the Copilot Coding Agent
# with Incus + Caddy and a Next.js dev server, including TLS certs trusted by Incus.
#
# AUTOMATIC USAGE: GitHub Copilot agents automatically detect and use this workflow
# when assigned to issues or pull requests. The workflow must be on the default branch.
#
# ARCHITECTURE:
# - Incus API server runs on https://localhost:8443 with self-signed cert
# - Caddy proxy on http://localhost:8080 handles client TLS to Incus
# - Next.js dev server on http://localhost:3000
# - Browser connects to Caddy (no client cert needed)
# - Caddy presents client cert to Incus on behalf of browser/agent
#
# TROUBLESHOOTING:
# - Check Summary step output for service URLs and status
# - Workflow fails if Incus or Next.js don't start within 30 seconds
# - Containers (incus-dev, caddy-dev) are auto-cleaned on runner teardown

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    
    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read
    

    env:
      NEXT_DEV_PORT: 3000
      INCUS_HTTPS_PORT: 8443
      CADDY_HTTP_PORT: 8080
      CADDY_ALT_PORT: 8081
      # Frontend expects a certificate path or env for TLS client auth
      ARARAT_CERT_DIR: ${{ github.workspace }}/.certs
      ARARAT_CERT_PEM: ${{ github.workspace }}/.certs/client.pem
      ARARAT_KEY_PEM: ${{ github.workspace }}/.certs/client.key
      # Allow origin matching the runner's IP; fallback to localhost
      DEV_ALLOWED_ORIGIN: http://localhost:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.45"

      - name: Cache Bun and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            **/node_modules
          key: ${{ runner.os }}-bun-1.1.45-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Incus (APT)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          # Add Zabbly Incus stable repo
          . /etc/os-release
          curl -fsSL https://pkgs.zabbly.com/key.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/zabbly.gpg
          echo "deb [arch=amd64] https://pkgs.zabbly.com/incus/stable ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo apt-get update -y
          sudo apt-get install -y incus incus-client uidmap dnsmasq-base squashfs-tools btrfs-progs xfsprogs lvm2

      - name: Initialize Incus daemon
        run: |
          set -euo pipefail
          # Ensure subuid/subgid ranges for root
          echo "root:1000000:1000000000" | sudo tee -a /etc/subuid /etc/subgid >/dev/null
          # Start incusd and allow sudo group access
          nohup sudo incusd --group sudo >/tmp/incusd.log 2>&1 &
          # Wait for daemon to respond
          for i in {1..90}; do
            if sudo incus version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! sudo incus version >/dev/null 2>&1; then
            echo "incusd failed to start" >&2
            sudo tail -n +1 /tmp/incusd.log || true
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -euo pipefail
          # Try bun first, fall back to npm if bun fails
          if bun install --frozen-lockfile; then
            echo "✓ Dependencies installed with bun (frozen lockfile)"
          elif bun install; then
            echo "✓ Dependencies installed with bun"
          elif npm install; then
            echo "⚠ Bun install failed, installed with npm instead"
          else
            echo "❌ Both bun and npm install failed" >&2
            exit 1
          fi

      - name: Create TLS certs directory
        run: |
          set -euo pipefail
          if [ -z "$ARARAT_CERT_DIR" ]; then
            echo "Error: ARARAT_CERT_DIR is not set" >&2
            exit 1
          fi
          mkdir -p "$ARARAT_CERT_DIR"

      - name: Provision client TLS cert for Incus (self-signed)
        run: |
          set -euo pipefail
          # Generate a self-signed client cert/key for dev
          openssl req -x509 -newkey rsa:4096 \
            -keyout "$ARARAT_KEY_PEM" -out "$ARARAT_CERT_PEM" \
            -days 365 -nodes -subj "/CN=ararat-copilot-agent"
          chmod 600 "$ARARAT_KEY_PEM"
          chmod 644 "$ARARAT_CERT_PEM"

      - name: Write Caddyfile for dev
        run: |
          cat > "$PWD/.caddy.Caddyfile" <<'CADDY'
          :80 {
                  @api_v1 {
                          path /1.0
                          path /1.0/*
                  }
                  # Proxy API to Incus with client TLS so browser doesn't need a cert
                  handle @api_v1 {
                          reverse_proxy https://127.0.0.1:8443 {
                                  transport http {
                                          tls
                                          tls_client_auth /etc/caddy/certs/client.pem /etc/caddy/certs/client.key
                                          tls_insecure_skip_verify
                                  }
                          }
                  }
                  handle {
                          reverse_proxy http://localhost:3000
                  }
          }

          :81 {
                  @api_v1 {
                          path /1.0
                          path /1.0/*
                  }
                  handle @api_v1 {
                          reverse_proxy https://127.0.0.1:8443 {
                                  transport http {
                                          tls
                                          tls_insecure_skip_verify
                                  }
                          }
                  }
                  handle {
                          root * /var/www/html
                          file_server
                          try_files {path}.html {path} /index.html
                  }
          }
          CADDY

      - name: Configure Incus
        run: |
          set -euo pipefail
          # Configure Incus HTTPS and CORS
          sudo incus config set core.https_address "[::]:8443"
          sudo incus config set core.https_allowed_headers "Content-Type, Sec-Fetch-Site"
          sudo incus config set core.https_allowed_methods "GET, POST, PUT, DELETE, OPTIONS, HEAD"
          sudo incus config set core.https_allowed_origin "$DEV_ALLOWED_ORIGIN"

      - name: Trust Copilot client cert in Incus
        run: |
          set -euo pipefail
          # Add the agent's client certificate to Incus trust store
          sudo incus config trust add-cert "$ARARAT_CERT_PEM" || true

      - name: Verify Incus HTTPS endpoint
        run: |
          set -euo pipefail
          # Ensure Incus HTTPS is responding before starting Caddy
          for i in {1..30}; do
            if curl -k --cert "$ARARAT_CERT_PEM" --key "$ARARAT_KEY_PEM" -sSf "https://127.0.0.1:8443/1.0" >/dev/null 2>&1; then
              echo "✓ Incus HTTPS endpoint ready"
              break
            fi
            sleep 1
          done
          curl -k --cert "$ARARAT_CERT_PEM" --key "$ARARAT_KEY_PEM" -sSf "https://127.0.0.1:8443/1.0" >/dev/null

      - name: Export environment for the agent and app
        run: |
          {
            echo "ARARAT_CERT_PEM=$ARARAT_CERT_PEM"
            echo "ARARAT_KEY_PEM=$ARARAT_KEY_PEM"
            echo "NEXT_PUBLIC_INCUS_BASE=https://localhost:8443"
            echo "NEXT_PUBLIC_API_BASE=http://localhost:8080"
          } >> "$GITHUB_ENV"

      - name: Start Caddy with dev config
        run: |
          set -euo pipefail
          docker run -d --name caddy-dev \
            --network host \
            -v "$PWD/.caddy.Caddyfile":/etc/caddy/Caddyfile \
            -v "$ARARAT_CERT_DIR":/etc/caddy/certs:ro \
            caddy:2
          # Wait for Caddy to bind
          sleep 3
          # Check that Caddy container is still running
          if ! docker ps | grep -q caddy-dev; then
            echo "Caddy container exited" >&2
            docker logs caddy-dev || true
            exit 1
          fi
          echo "✓ Caddy started and running"

      - name: Install Playwright browsers
        run: |
          bunx playwright@latest install --with-deps

      - name: Summary
        run: |
          echo "✓ Dev environment ready"
          echo "  - Incus API: https://localhost:8443"
          echo "  - Caddy proxy: http://localhost:8080"
          echo "  - Client cert: $ARARAT_CERT_PEM"
          echo "  - Dependencies installed"
          echo ""
          echo "Copilot can now start the Next.js dev server and run tests"
